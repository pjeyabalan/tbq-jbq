databases:
  - name: tbq-database
    databaseName: tbq
    user: tbq_user
    plan: free

services:
  - type: web
    name: tbq-jbq
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: tbq-database
          property: connectionString

