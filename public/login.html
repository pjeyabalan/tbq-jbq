<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Coach Login - Junior Bible Quiz (JBQ) 2026</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              800: '#1e40af',
              900: '#1e3a8a',
              950: '#172554'
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">

  <!-- MAIN LOGIN CARD -->
  <div class="w-full max-w-sm bg-slate-900/90 border border-slate-800 rounded-3xl p-6 shadow-2xl backdrop-blur-md">
    
    <!-- HEADER -->
    <div class="text-center mb-6">
      <div class="w-14 h-14 rounded-2xl bg-amber-400 text-slate-950 flex items-center justify-center text-2xl font-black mx-auto mb-3 shadow-lg shadow-amber-400/20">
        ⚡
      </div>
      <div class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-amber-400/10 border border-amber-400/30 text-amber-300 text-[11px] font-bold tracking-wide uppercase mb-1.5">
        JBQ 2026 Tournament
      </div>
      <h1 class="text-xl font-black text-white tracking-tight">Coach & Scorer Login</h1>
      <p class="text-xs text-slate-400 mt-1">
        Sign in to score official matches, kid points, fouls, and rebound questions.
      </p>
    </div>

    <!-- ERROR ALERT -->
    <div id="login-error-alert" class="hidden mb-4 p-3 bg-rose-500/15 border border-rose-500/30 rounded-2xl text-rose-300 text-xs font-semibold text-center animate-fade-in">
      Invalid username or passcode.
    </div>

    <!-- LOGIN FORM -->
    <form id="login-form" onsubmit="handleLoginSubmit(event)" class="space-y-4">
      <div>
        <label for="username" class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1.5">
          Coach Username
        </label>
        <input
          type="text"
          id="username"
          name="username"
          required
          autocapitalize="none"
          autocorrect="off"
          autocomplete="username"
          placeholder="e.g. allwina, hannah, supercoach"
          class="w-full px-3.5 py-2.5 rounded-xl bg-slate-800/90 border border-slate-700/80 text-white text-sm font-semibold placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-amber-400 focus:border-amber-400 transition-all"
        >
      </div>

      <div>
        <div class="flex items-center justify-between mb-1.5">
          <label for="passcode" class="block text-[11px] font-bold uppercase tracking-wider text-slate-400">
            Passcode
          </label>
          <button type="button" onclick="togglePasscodeVisibility()" class="text-[11px] text-amber-400 hover:text-amber-300 font-bold">
            <span id="passcode-toggle-text">Show</span>
          </button>
        </div>
        <input
          type="password"
          id="passcode"
          name="passcode"
          required
          autocomplete="current-password"
          placeholder="Enter coach passcode"
          class="w-full px-3.5 py-2.5 rounded-xl bg-slate-800/90 border border-slate-700/80 text-white text-sm font-semibold placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-amber-400 focus:border-amber-400 transition-all"
        >
      </div>

      <button
        type="submit"
        id="submit-btn"
        class="w-full bg-amber-400 hover:bg-amber-300 active:scale-98 text-slate-950 font-black py-3 px-4 rounded-xl text-sm shadow-lg shadow-amber-400/20 transition-all flex items-center justify-center gap-2 cursor-pointer mt-2"
      >
        <span id="btn-text">Sign In to Scoresheet</span>
        <span id="btn-icon">⚡</span>
      </button>
    </form>

    <!-- DIVIDER -->
    <div class="relative my-6">
      <div class="absolute inset-0 flex items-center">
        <div class="w-full border-t border-slate-800"></div>
      </div>
      <div class="relative flex justify-center text-[10px] uppercase font-bold tracking-wider">
        <span class="bg-slate-900 px-3 text-slate-500">Spectator & Live Scores</span>
      </div>
    </div>

    <!-- LINK TO PUBLIC SCORES -->
    <a
      href="/scores"
      class="w-full py-2.5 px-4 rounded-xl border border-slate-700/80 hover:bg-slate-800 text-slate-300 hover:text-white font-bold text-xs flex items-center justify-center gap-2 transition-all no-underline"
    >
      <span>🏆</span>
      <span>View Live Public Scores & Standings</span>
    </a>

    <!-- FOOTER NOTE -->
    <p class="text-[10px] text-slate-400 text-center mt-6">
      Junior Bible Quiz Official Scoring System &bull; 2026
    </p>

  </div>

  <script>
    // Toggle Passcode Visibility
    function togglePasscodeVisibility() {
      const passcodeEl = document.getElementById('passcode');
      const toggleText = document.getElementById('passcode-toggle-text');
      if (passcodeEl.type === 'password') {
        passcodeEl.type = 'text';
        toggleText.textContent = 'Hide';
      } else {
        passcodeEl.type = 'password';
        toggleText.textContent = 'Show';
      }
    }

    // Auto-check if already logged in on load
    document.addEventListener('DOMContentLoaded', async () => {
      const savedToken = localStorage.getItem('tbq_coach_token');
      if (savedToken) {
        try {
          const res = await fetch('/api/auth/me', {
            headers: { 'Authorization': 'Bearer ' + savedToken }
          });
          if (res.ok) {
            // Already logged in! Redirect straight to scoresheet
            window.location.replace('/scoresheet');
            return;
          } else {
            localStorage.removeItem('tbq_coach_token');
          }
        } catch (e) {
          console.warn('Auth check error:', e);
        }
      }

      // Auto-focus username field
      const userField = document.getElementById('username');
      if (userField) userField.focus();
    });

    // Handle Form Submit
    async function handleLoginSubmit(event) {
      event.preventDefault();
      const usernameInput = document.getElementById('username');
      const passcodeInput = document.getElementById('passcode');
      const submitBtn = document.getElementById('submit-btn');
      const btnText = document.getElementById('btn-text');
      const btnIcon = document.getElementById('btn-icon');
      const errorAlert = document.getElementById('login-error-alert');

      const username = usernameInput.value.trim();
      const passcode = passcodeInput.value.trim();

      if (!username || !passcode) return;

      errorAlert.classList.add('hidden');
      submitBtn.disabled = true;
      submitBtn.classList.add('opacity-75');
      btnText.textContent = 'Signing in...';
      btnIcon.textContent = '⏳';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, passcode })
        });
        const data = await res.json();

        if (!res.ok) {
          errorAlert.textContent = data.error || 'Invalid coach username or passcode.';
          errorAlert.classList.remove('hidden');
          submitBtn.disabled = false;
          submitBtn.classList.remove('opacity-75');
          btnText.textContent = 'Sign In to Scoresheet';
          btnIcon.textContent = '⚡';
          return;
        }

        // Store active coach session
        localStorage.setItem('tbq_coach_token', data.token);
        localStorage.removeItem('tbq_logged_out_explicit');

        // Redirect directly to the official coach scoring room
        window.location.replace('/scoresheet');
      } catch (err) {
        errorAlert.textContent = 'Network error while attempting to sign in. Please verify your connection.';
        errorAlert.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.classList.remove('opacity-75');
        btnText.textContent = 'Sign In to Scoresheet';
        btnIcon.textContent = '⚡';
      }
    }
  </script>
</body>
</html>
